<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1240" viewBox="0 0 1400 1240" role="img" aria-labelledby="title desc">
  <title id="title">同一条找杯子轨迹下，保留不同的反传路径</title>
  <desc id="desc">三种规则均读取完整历史，并学习前往柜子A这一相同动作。必要信息优先组保留杯子位置的局部反传路径，无关信息优先组改为保留同量书本位置路径，完整参照保留二者。蓝色实线是读取数值的前向路径，红色虚线是动作损失回传的路径；灰色截线表示数值仍可读取，但此处生成路径不接收这项梯度。各组预测位置始终可贡献共享参数更新。教学序列含16格，标签在13至16格，预测位置在12至15格；格子不代表真实分词。</desc>
  <defs>
    <marker id="forward" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#216fa3"/></marker>
    <marker id="backward" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#ad3c3c"/></marker>
    <style>
      text { font-family: sans-serif; fill: #183040; }
      .title { font-size: 29px; font-weight: 700; }
      .section { font-size: 23px; font-weight: 700; }
      .body { font-size: 20px; }
      .small { font-size: 17px; }
      .tiny { font-size: 15px; }
      .panel { fill: #ffffff; stroke: #bdccd5; stroke-width: 1.5; }
      .node { fill: #f5f9fc; stroke: #7293a8; stroke-width: 1.8; }
      .forward { fill: none; stroke: #216fa3; stroke-width: 3; marker-end: url(#forward); }
      .backward { fill: none; stroke: #ad3c3c; stroke-width: 3; stroke-dasharray: 8 6; marker-end: url(#backward); }
      .stopped { fill: none; stroke: #8a949a; stroke-width: 2.5; stroke-dasharray: 5 5; }
      .stopbar { stroke: #697780; stroke-width: 4; }
      .red { fill: #963131; }
      .blue { fill: #216fa3; }
    </style>
  </defs>
  <rect width="1400" height="1240" fill="#f1f5f8"/>
  <text x="38" y="48" class="title">相同历史、相同正确动作：本次更新允许经过哪里？</text>
  <text x="38" y="82" class="body">在相同参数起点比较一次计算。模型训练后可以不同；图中没有实验结果。</text>

  <rect x="30" y="105" width="1340" height="170" rx="12" class="panel"/>
  <text x="52" y="135" class="body">同一完整记录：先查找未果 → 看见杯子在A、书本在D → 返回共同起点 → 学习“前往柜子A”</text>
  <text x="52" y="165" class="small">16个教学格；真实Token跨度须由分词器重算。文字始终读入，预测下一项时不能看未来。</text>
  <g text-anchor="middle">
    <g class="tiny">
      <rect x="53" y="180" width="75" height="57" rx="5" fill="#e4ebf0"/><text x="90" y="201">1</text><text x="90" y="224">开始</text>
      <rect x="132" y="180" width="75" height="57" rx="5" fill="#e4ebf0"/><text x="169" y="201">2</text><text x="169" y="224">任务</text>
      <rect x="211" y="180" width="75" height="57" rx="5" fill="#e4ebf0"/><text x="248" y="201">3</text><text x="248" y="224">此前</text>
      <rect x="290" y="180" width="75" height="57" rx="5" fill="#e4ebf0"/><text x="327" y="201">4</text><text x="327" y="224">查找</text>
      <rect x="369" y="180" width="75" height="57" rx="5" fill="#e4ebf0"/><text x="406" y="201">5</text><text x="406" y="224">记录</text>
      <rect x="448" y="180" width="75" height="57" rx="5" fill="#e2f1e9"/><text x="485" y="201">6</text><text x="485" y="224">杯子</text>
      <rect x="527" y="180" width="75" height="57" rx="5" fill="#e2f1e9"/><text x="564" y="201">7</text><text x="564" y="224">位置</text>
      <rect x="606" y="180" width="75" height="57" rx="5" fill="#e2f1e9"/><text x="643" y="201">8</text><text x="643" y="224">柜子A</text>
      <rect x="685" y="180" width="75" height="57" rx="5" fill="#fff1d7"/><text x="722" y="201">9</text><text x="722" y="224">书本</text>
      <rect x="764" y="180" width="75" height="57" rx="5" fill="#fff1d7"/><text x="801" y="201">10</text><text x="801" y="224">位置</text>
      <rect x="843" y="180" width="75" height="57" rx="5" fill="#fff1d7"/><text x="880" y="201">11</text><text x="880" y="224">书架D</text>
      <rect x="922" y="180" width="75" height="57" rx="5" fill="#dcebf6"/><text x="959" y="201">12</text><text x="959" y="224">当前</text>
      <rect x="1001" y="180" width="75" height="57" rx="5" fill="#dcebf6"/><text x="1038" y="201">13</text><text x="1038" y="224">前往</text>
      <rect x="1080" y="180" width="75" height="57" rx="5" fill="#dcebf6"/><text x="1117" y="201">14</text><text x="1117" y="224">柜子</text>
      <rect x="1159" y="180" width="75" height="57" rx="5" fill="#dcebf6"/><text x="1196" y="201">15</text><text x="1196" y="224">A</text>
      <rect x="1238" y="180" width="75" height="57" rx="5" fill="#e4ebf0"/><text x="1275" y="201">16</text><text x="1275" y="224">动作结束</text>
    </g>
  </g>
  <text x="52" y="260" class="small">共同保留：开始位置1 + 预测位置12–15，共5格。四个正确标签位于13–16；它们不是同一个位置集合。</text>

  <g transform="translate(0 0)">
    <rect x="30" y="295" width="1340" height="250" rx="12" class="panel"/>
    <text x="52" y="329" class="section">必要信息优先：共同5格 + 杯子位置6–8 = 8格</text>
    <rect x="70" y="350" width="330" height="66" rx="8" fill="#edf7f0" stroke="#689c7b" stroke-width="1.8"/>
    <text x="90" y="377" class="body">生成“杯子在A”的内部数值</text><text x="90" y="402" class="small">位置6–8：数值保留，允许反传</text>
    <rect x="70" y="440" width="330" height="66" rx="8" fill="#fff7e8" stroke="#b7a47b" stroke-width="1.8"/>
    <text x="90" y="467" class="body">生成“书本在D”的内部数值</text><text x="90" y="492" class="small">位置9–11：数值保留，此路停止</text>
    <rect x="615" y="388" width="265" height="90" rx="8" class="node"/>
    <text x="641" y="419" class="body">预测位置12–15</text><text x="641" y="451" class="body">仍读取两类历史数值</text>
    <rect x="1100" y="388" width="230" height="90" rx="8" class="node"/>
    <text x="1120" y="419" class="body">四个相同正确标签</text><text x="1120" y="451" class="body">产生同一动作损失</text>
    <path d="M400 370 C495 370 517 403 610 403" class="forward"/>
    <path d="M400 485 C495 485 517 459 610 459" class="forward"/>
    <path d="M880 414 H1095" class="forward"/>
    <path d="M1100 451 H885" class="backward"/>
    <path d="M615 424 C518 424 497 402 405 402" class="backward"/>
    <path d="M615 443 C530 443 510 458 443 458" class="stopped"/><path d="M437 444 V474" class="stopbar"/>
    <text x="930" y="396" class="tiny blue">预测与比较</text><text x="930" y="481" class="tiny red">误差反传</text>
    <text x="615" y="520" class="small">预测位置与获准的历史计算共同贡献本组的参数更新。</text>
  </g>

  <g transform="translate(0 270)">
    <rect x="30" y="295" width="1340" height="250" rx="12" class="panel"/>
    <text x="52" y="329" class="section">无关信息优先：共同5格 + 书本位置9–11 = 8格</text>
    <rect x="70" y="350" width="330" height="66" rx="8" fill="#edf7f0" stroke="#689c7b" stroke-width="1.8"/>
    <text x="90" y="377" class="body">生成“杯子在A”的内部数值</text><text x="90" y="402" class="small">位置6–8：数值保留，此路停止</text>
    <rect x="70" y="440" width="330" height="66" rx="8" fill="#fff7e8" stroke="#b7a47b" stroke-width="1.8"/>
    <text x="90" y="467" class="body">生成“书本在D”的内部数值</text><text x="90" y="492" class="small">位置9–11：数值保留，允许反传</text>
    <rect x="615" y="388" width="265" height="90" rx="8" class="node"/>
    <text x="641" y="419" class="body">预测位置12–15</text><text x="641" y="451" class="body">仍读取两类历史数值</text>
    <rect x="1100" y="388" width="230" height="90" rx="8" class="node"/>
    <text x="1120" y="419" class="body">四个相同正确标签</text><text x="1120" y="451" class="body">产生同一动作损失</text>
    <path d="M400 370 C495 370 517 403 610 403" class="forward"/>
    <path d="M400 485 C495 485 517 459 610 459" class="forward"/>
    <path d="M880 414 H1095" class="forward"/>
    <path d="M1100 451 H885" class="backward"/>
    <path d="M615 424 C525 424 510 402 443 402" class="stopped"/><path d="M437 388 V417" class="stopbar"/>
    <path d="M615 443 C520 443 497 458 405 458" class="backward"/>
    <text x="930" y="396" class="tiny blue">预测与比较</text><text x="930" y="481" class="tiny red">误差反传</text>
    <text x="615" y="520" class="small">杯子信息仍能被利用；共享参数仍通过保留位置学习。</text>
  </g>

  <g transform="translate(0 540)">
    <rect x="30" y="295" width="1340" height="250" rx="12" class="panel"/>
    <text x="52" y="329" class="section">完整反传参照：16格均允许正常反传，用于观察能力与资源差距</text>
    <rect x="70" y="350" width="330" height="66" rx="8" fill="#edf7f0" stroke="#689c7b" stroke-width="1.8"/>
    <text x="90" y="377" class="body">生成“杯子在A”的内部数值</text><text x="90" y="402" class="small">位置6–8：数值保留，允许反传</text>
    <rect x="70" y="440" width="330" height="66" rx="8" fill="#fff7e8" stroke="#b7a47b" stroke-width="1.8"/>
    <text x="90" y="467" class="body">生成“书本在D”的内部数值</text><text x="90" y="492" class="small">位置9–11：数值保留，允许反传</text>
    <rect x="615" y="388" width="265" height="90" rx="8" class="node"/>
    <text x="641" y="419" class="body">预测位置12–15</text><text x="641" y="451" class="body">仍读取两类历史数值</text>
    <rect x="1100" y="388" width="230" height="90" rx="8" class="node"/>
    <text x="1120" y="419" class="body">四个相同正确标签</text><text x="1120" y="451" class="body">产生同一动作损失</text>
    <path d="M400 370 C495 370 517 403 610 403" class="forward"/>
    <path d="M400 485 C495 485 517 459 610 459" class="forward"/>
    <path d="M880 414 H1095" class="forward"/>
    <path d="M1100 451 H885" class="backward"/>
    <path d="M615 424 C518 424 497 402 405 402" class="backward"/>
    <path d="M615 443 C520 443 497 458 405 458" class="backward"/>
    <text x="930" y="396" class="tiny blue">预测与比较</text><text x="930" y="481" class="tiny red">误差反传</text>
    <text x="615" y="520" class="small">它与8格规则的比较同时改变计算数量，不能单独证明选位置有效。</text>
  </g>

  <path d="M48 1131 H130" class="forward"/><text x="146" y="1138" class="body">读取数值</text>
  <path d="M315 1131 H397" class="backward"/><text x="413" y="1138" class="body">误差回传</text>
  <path d="M583 1131 H660" class="stopped"/><path d="M665 1116 V1146" class="stopbar"/><text x="688" y="1138" class="body">此路停止，前向数值保留</text>
  <text x="48" y="1177" class="small">局部计算框概括对应位置在各层的运算，不能理解为“只在整层末尾截断”。其余历史及随机组见正文表。</text>
  <text x="48" y="1210" class="small">最后用同一批未见条件检验：杯子在A就去A，在B就去B，并实际完成取杯与放置；另测显存、耗时和总成本。</text>
</svg>
