name: Validate AI radar

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-ai-radar
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test deterministic radar logic
        run: node agent/radar.test.mjs
      - name: Audit radar artifacts
        shell: pwsh
        run: ./agent/audit-radar.ps1 data/radar
