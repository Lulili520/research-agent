name: Windows checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r agent/requirements-dev.txt
      - run: python agent/check.py
      - name: Verify PowerShell audit wrappers
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          powershell -NoProfile -File agent/audit-research.ps1 research/__missing__
          if ($LASTEXITCODE -ne 2) { throw "Unexpected review audit exit code: $LASTEXITCODE" }
          powershell -NoProfile -File agent/audit-iterative-research.ps1 research/__missing__
          if ($LASTEXITCODE -ne 2) { throw "Unexpected iterative audit exit code: $LASTEXITCODE" }
          exit 0
